name: Build QUEST LIFE 4.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Project ZIP
        run: |
          test -f QUEST_LIFE_4_0_Android_Project.zip
          unzip -l QUEST_LIFE_4_0_Android_Project.zip

      - name: Extract Project
        run: |
          unzip -q QUEST_LIFE_4_0_Android_Project.zip -d extracted
          test -f extracted/quest_life_android/settings.gradle
          test -f extracted/quest_life_android/build.gradle
          test -f extracted/quest_life_android/app/build.gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build QUEST LIFE 4.0
        working-directory: extracted/quest_life_android
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s extracted/quest_life_android/app/build/outputs/apk/debug/app-debug.apk
          echo "QUEST LIFE 4.0 APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUEST-LIFE-4.0-APK
          path: extracted/quest_life_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
